# Touchpads (laptops); on a machine without one this does nothing.
Section "InputClass"
    Identifier "touchpad"
    Driver "libinput"
    MatchIsTouchpad "on"
    Option "Tapping" "on"                  # tap: 1 finger left, 2 right, 3 middle click
    Option "ScrollMethod" "twofinger"      # two-finger scrolling, vertical and horizontal
    Option "DisableWhileTyping" "on"       # ignore the touchpad while typing
EndSection
