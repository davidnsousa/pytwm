status_success_fg = "#a6e3a1"
status_success_bg = "#2a3a2e"
status_warning_fg = "#f9e2af"
status_error_fg = "#f38ba8"
status_error_bg = "#3b2534"
status_shortcut_fg = "#7f849c"
status_percent_fg = "#cba6f7"
status_dot_fg = "#7f849c"
toc_hover_fg = "#cdd6f4"
