# Catppuccin Mocha for leaf (pytwm's Help uses it: leaf --theme catppuccin-mocha)
base = "ocean"
syntax = "base16-eighties.dark"   # code blocks: leaf has no Catppuccin one; this is the closest

[ui]
toc_bg = "#181825"
toc_border = "#45475a"
content_bg = "#1e1e2e"
scrollbar_hover = "#cba6f7"
status_bg = "#181825"
status_separator = "#7f849c"
